<ion-content class="categories">

  <ion-list>

    <ion-item
      *ngFor="let category of categories"
      class="categories__item">

      <ion-label>

        <h2 class="categories__name">
          <span
            class="categories__color"
            [style.background]="category.color">
          </span>

          {{ category.name }}
        </h2>

      </ion-label>

      <div class="categories__actions">

        <ion-button
          fill="clear"
          (click)="delete(category.id)">
          <ion-icon name="trash" color="danger"></ion-icon>
        </ion-button>

      </div>

    </ion-item>

  </ion-list>

</ion-content>
