
<ion-tabs>

  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="todos">
      <ion-icon name="list" color="secondary"></ion-icon>
      <ion-label color="primary">Todos</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="categories">
      <ion-icon name="albums" color="secondary"></ion-icon>
      <ion-label color="primary">Categorías</ion-label>
    </ion-tab-button>

    <ion-tab-button
      *ngIf="showSettings"
      tab="settings">
      <ion-icon name="settings" color="secondary"></ion-icon>
      <ion-label color="primary">Configuración</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
