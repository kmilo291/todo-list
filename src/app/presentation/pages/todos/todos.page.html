<ion-header>
  <ion-toolbar>
    <ion-title>Todos</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="addTodo()">
        <ion-icon name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>

    <ion-item *ngFor="let todo of todos">

      <ion-label>
        <h2>{{ todo.title }} {{todo.id}}</h2>

        <p *ngIf="todo.category">
          Categoría: {{ todo.category.name }}
        </p>

        <p>
          Estado: {{ todo.completed ? 'Completado' : 'Pendiente' }}
        </p>
      </ion-label>

      <ion-item>
        <ion-label>Categoría</ion-label>
        <ion-select (ionChange)="changeCategory(todo, $event.detail.value)">
          <ion-select-option
            *ngFor="let category of categories"
            [value]="category.id">
            {{ category.name }} {{category.id}}
          </ion-select-option>
        </ion-select>
      </ion-item>

      <ion-button
        fill="clear"
        slot="end"
        (click)="delete(todo.id)">
        <ion-icon name="trash" color="danger"></ion-icon>
      </ion-button>

    </ion-item>

  </ion-list>

</ion-content>
