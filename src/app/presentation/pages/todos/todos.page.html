<ion-header>
  <ion-toolbar>
    <ion-title>Todos</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="addTodo()">
        <ion-icon name="add" ></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>

    <ion-item *ngFor="let todo of todos">

      <ion-label>
        <h2>{{ todo.title }} {{todo.id}}</h2>

        <p *ngIf="todo.category">
          Categoría: {{ todo.category.name }}
        </p>

        <p>
          Estado: {{ todo.completed ? 'Completado' : 'Pendiente' }}
        </p>
      </ion-label>

      <ion-buttons slot="end" (click)="delete(todo.id)">
        <ion-button fill="clear" slot="end" (click)="delete(todo.id)">
          <ion-icon name="trash" color="danger"></ion-icon>
        </ion-button>
      </ion-buttons>

    </ion-item>

  </ion-list>

</ion-content>
