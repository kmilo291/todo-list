<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-button size="small" (click)="startHeavyTask()" [disabled]="running">
    Run Worker
  </ion-button>

  <div *ngIf="running" style="padding:16px">

    <ion-progress-bar
      [value]="progress">
    </ion-progress-bar>

    <p>
      {{ (progress * 100) | number:'1.0-0' }} %
    </p>

  </div>

</ion-content>
