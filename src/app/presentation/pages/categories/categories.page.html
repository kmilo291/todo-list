<ion-header>
  <ion-toolbar>
    <ion-title>Categories</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="addCategory()">
        <ion-icon name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>

    <ion-item *ngFor="let category of categories">

      <ion-label>
        <h2>{{ category.name }} {{category.id}}</h2>

        <!-- <p *ngIf="todo.category">
          Categoría: {{ todo.category.name }}
        </p> -->

        <!-- <p>
          Estado: {{ categorie.completed ? 'Completado' : 'Pendiente' }}
        </p> -->
      </ion-label>

      <ion-button
        fill="clear"
        slot="end"
        (click)="delete(category.id)">
        <ion-icon name="trash" color="danger"></ion-icon>
      </ion-button>

    </ion-item>

  </ion-list>

</ion-content>
